name = "gleamcms"
version = "0.2.0"
description = "A fact-oriented, sovereign CMS built on the AaronDB datalog engine"
gleam = ">= 1.7.0"
licences = ["MIT"]

[repository]
type = "github"
user = "moneyacademyKE"
repo = "gleamcms"

# gleamcms owns the web layer (wisp/mist/lustre/gleam_http/simplifile).
# aarondb is depended on as a pure datalog engine.
[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
aarondb = ">= 2.4.0"
wisp = ">= 1.6.0"
mist = ">= 4.0.0"
gleam_http = ">= 3.7.0"
lustre = ">= 4.6.0"
simplifile = ">= 2.2.0"
gleam_json = ">= 2.0.0"
gleam_regexp = ">= 1.0.0"
logging = ">= 1.3.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.2.0"
